server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── API log files (written by Winston to LOG_DIR) ───────────────────────────
  - job_name: api-files
    static_configs:
      - targets: [localhost]
        labels:
          job:  api
          app:  precisioncore-api
          __path__: /var/log/api/*.log
    pipeline_stages:
      # Winston outputs JSON — parse it so Loki indexes level, requestId, etc.
      - json:
          expressions:
            level:     level
            message:   message
            requestId: requestId
            userId:    userId
            route:     route
            duration:  duration
      - labels:
          level:
          requestId:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ── Docker container stdout/stderr ──────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['logging=promtail']   # only containers with this label
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level:   level
            message: message
      - labels:
          level:
